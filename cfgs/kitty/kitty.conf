font_family FantasqueSansM Nerd Font Mono
# Intone Mono
#
# FantasqueSansM
# MonaspiceNe
# MonaspiceKr
# Hurmit
# fc-list | sed 's/^[^:]*//' | sed 's/:style.*//' | cut -c 3- | sed 's/,.*//' | sort | uniq | nl | more

font_size 18.0
adjust_line_height 2
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9

enable_audio_bell no

shell /run/current-system/sw/bin/fish
confirm_os_window_close 0

background #272e33
foreground #d3c6aa

