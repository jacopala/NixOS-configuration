color1 #e67e80
color2 #a7c080
color3 #dbbc7f
color4 #7fbbb3
color5 #d599b6
color6 #83c092
color7 #d3c6aa

color8  #475258
color9  #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbb3
color13 #d599b6
color14 #83c092
color15 #d3c6aa
